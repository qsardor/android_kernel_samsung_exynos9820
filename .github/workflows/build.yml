name: Samsung Exynos 9820/9825 Kernel CI (Stock One UI + KernelSU-Next + SuSFS)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Model'
        required: true
        default: 'd2xks'
        type: choice
        options:
          - d2xks
          - d1xks
  push:
    branches:
      - susfs-next-gen
    tags:
      - 'v*'

jobs:
  build:
    name: Build Kernel (${{ github.event.inputs.device || 'd2xks' }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5 libtinfo5 libncurses-dev zip cpio \
            python3 curl rsync liblz4-tool
          for lib in libtinfo libncurses; do
            if [ ! -f /usr/lib/x86_64-linux-gnu/${lib}.so.5 ] && [ -f /usr/lib/x86_64-linux-gnu/${lib}.so.6 ]; then
              sudo ln -sf /usr/lib/x86_64-linux-gnu/${lib}.so.6 /usr/lib/x86_64-linux-gnu/${lib}.so.5
            fi
            if [ ! -f /lib/x86_64-linux-gnu/${lib}.so.5 ] && [ -f /lib/x86_64-linux-gnu/${lib}.so.6 ]; then
              sudo ln -sf /lib/x86_64-linux-gnu/${lib}.so.6 /lib/x86_64-linux-gnu/${lib}.so.5
            fi
          done

      - name: Compile Kernel & Package Odin / TWRP Packages
        run: |
          chmod +x build_kernel.sh
          chmod -R +x prebuilts/
          ./build_kernel.sh ${{ github.event.inputs.device || 'd2xks' }}

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.device || 'd2xks' }}_KSUN_v3.4.2_SUSFS_v1.5.5
          path: |
            prebuilts/*.tar
            prebuilts/*.zip

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            prebuilts/*.tar
            prebuilts/*.zip
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
