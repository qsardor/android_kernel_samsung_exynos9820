name: LineageOS 23.2 Kernel CI (Android 16 + KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Model'
        required: true
        default: 'd2x'
        type: choice
        options:
          - d2x
          - d1x
      ksu_version:
        description: 'KernelSU-Next Version/Tag (e.g. v3.4.3)'
        required: true
        default: 'v3.4.3'
        type: string
  push:
    branches:
      - lineage-23.2
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build LineageOS 23.2 Kernel (${{ github.event.inputs.device || 'd2x' }}) - KSU ${{ github.event.inputs.ksu_version || 'v3.4.3' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5 libtinfo5 libncurses-dev zip cpio \
            python3 curl rsync liblz4-tool git \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          for lib in libtinfo libncurses; do
            if [ ! -f /usr/lib/x86_64-linux-gnu/${lib}.so.5 ] && [ -f /usr/lib/x86_64-linux-gnu/${lib}.so.6 ]; then
              sudo ln -sf /usr/lib/x86_64-linux-gnu/${lib}.so.6 /usr/lib/x86_64-linux-gnu/${lib}.so.5
            fi
            if [ ! -f /lib/x86_64-linux-gnu/${lib}.so.5 ] && [ -f /lib/x86_64-linux-gnu/${lib}.so.6 ]; then
              sudo ln -sf /lib/x86_64-linux-gnu/${lib}.so.6 /lib/x86_64-linux-gnu/${lib}.so.5
            fi
          done

      - name: Compile LineageOS Kernel & Package Boot Image
        run: |
          chmod +x build_lineage.sh
          chmod -R +x prebuilts/
          ./build_lineage.sh ${{ github.event.inputs.device || 'd2x' }} ${{ github.event.inputs.ksu_version || 'v3.4.3' }}

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device || 'd2x' }}_LineageOS23.2_KSUN_${{ github.event.inputs.ksu_version || 'v3.4.3' }}
          path: |
            prebuilts/*.img
            prebuilts/*.zip

      - name: Determine Release Information
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="lineage-23.2-${{ github.event.inputs.ksu_version || 'v3.4.3' }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: LineageOS 23.2 Kernel (${{ github.event.inputs.device || 'd2x' }}) - KernelSU-Next ${{ github.event.inputs.ksu_version || 'v3.4.3' }}
          body: |
            ### LineageOS 23.2 (Android 16) Kernel Flashable Package
            - **Target Device:** Samsung Galaxy Note 10+ 5G (`${{ github.event.inputs.device || 'd2x' }}` / Exynos 9825)
            - **Root Framework:** KernelSU-Next `${{ github.event.inputs.ksu_version || 'v3.4.3' }}` (Manual Ring 0 Hooks)
            - **Kernel Version:** Linux 4.14.356 (OpenELA)
            - **Headless Display Fix:** Integrated MIPI LCD uninit / panel bypass
            - **Anti-Disconnect Fix:** Persistent ADB gadget USB state

            #### Flashable Artifacts
            - `boot_lineage_ksu_${{ github.event.inputs.device || 'd2x' }}.img` (Fastboot / Heimdall / TWRP Image)
            - `lineage-23.2_ksunext_${{ github.event.inputs.device || 'd2x' }}_signed.zip` (TWRP / Lineage Recovery Flashable Zip)

            > Created by Antigravity & Q.S@RDOR
          files: |
            prebuilts/*.img
            prebuilts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
